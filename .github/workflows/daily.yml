name: daily-brief

on:
  # 不再用 GitHub 自己的 cron：实测它会把 23:33 UTC 的任务拖到次日 03:29 UTC 才跑
  # （晚 3 小时 56 分），甚至整点排队的任务直接丢弃、连运行记录都不留。
  # 现在由 iPhone 快捷指令每天 07:00 触发 workflow_dispatch，
  # 或由任意外部工具 POST repository_dispatch（见 README「外部定时器」）。
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      limit:
        description: "只取前几条（留空 = 用 config.yaml 的 max_items）"
        type: string
        default: ""
      dry_run:
        description: "只生成文件，不发邮件也不推送"
        type: boolean
        default: false
      debug:
        description: "打印详细日志"
        type: boolean
        default: false
      force:
        description: "今天已经发过了也要再发一次"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 同一天只投递一次：快捷指令手滑点两下、或者外部定时器和快捷指令撞车，
      # 都不会重复发邮件 / 重复推 Bark。想强行再发一次就勾 force。
      #
      # 窗口按"北京时间的自然日"算，不是按"最近 N 小时"：
      # 07:00 的投递在 UTC 是前一天 23:00，用小时窗口会把今天上午那次
      # 晚到的投递算进来，导致第二天早上被误判成"已经发过了"。
      - name: Already delivered today?
        id: guard
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.force != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_day=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          # 注意：date 同时给 -d 和 -u 时会把输入当成 UTC；
          # 而 -d "… Asia/Shanghai" 这种带时区名的写法 GNU date 不认。
          # 所以先在目标时区算出 epoch，再转成 UTC 字符串。
          epoch=$(TZ=Asia/Shanghai date -d "$local_day 00:00" +%s)
          since=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)
          echo "北京日期 $local_day，窗口起点 $since"
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=40" \
              --jq "[.workflow_runs[] | select((.event == \"schedule\" or .event == \"repository_dispatch\" or .event == \"workflow_dispatch\") and .conclusion == \"success\" and .created_at >= \"$since\")] | length")
          echo "今天已成功投递：$n 次"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          # 正文抽取遇到 403 的站点（France 24 等）要用无头浏览器兜底，
          # 所以 Actions 里也装一份 Chromium。
          python -m playwright install --with-deps chromium

      - name: Build the brief
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          PAYLOAD_LIMIT: ${{ github.event.client_payload.limit }}
        run: |
          ARGS=""
          # 手动触发的输入
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          # 外部触发时 client_payload 里带的参数
          if [ -n "${PAYLOAD_LIMIT:-}" ]; then ARGS="$ARGS --limit $PAYLOAD_LIMIT"; fi
          case "${PAYLOAD_DRY_RUN:-}" in
            true|True) ARGS="$ARGS --dry-run" ;;
          esac
          echo "运行参数：${ARGS:-（无）}"
          python -m newsbrief $ARGS

      - name: Upload artifacts
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
