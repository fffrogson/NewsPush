name: daily-brief

on:
  # 三个时间点，全部避开整点：GitHub 文档写明"高负载时段包括每个小时的开始"，
  # 整点排队的定时任务有概率被直接丢弃（不留任何运行记录）。
  # 北京 07:07 / 07:37 / 08:07。第一个成功投递后，后面两个会被 guard 跳过。
  schedule:
    - cron: "7 23 * * *"
    - cron: "37 23 * * *"
    - cron: "7 0 * * *"
  # 外部定时器（cron-job.org / Cloudflare Worker 等）用这个事件踢一下，
  # 比 GitHub 自己的调度靠谱。详见 README「外部定时器」一节。
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      limit:
        description: "只取前几条（留空 = 用 config.yaml 的 max_items）"
        type: string
        default: ""
      dry_run:
        description: "只生成文件，不发邮件也不推送"
        type: boolean
        default: false
      debug:
        description: "打印详细日志"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 定时触发（schedule）和外部触发（repository_dispatch）都要先看今天投递过没有，
      # 避免重复发邮件、重复推送。手动触发不受限制，永远照常执行。
      - name: Already delivered today?
        id: guard
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=30" \
              --jq "[.workflow_runs[] | select((.event == \"schedule\" or .event == \"repository_dispatch\") and .conclusion == \"success\" and .created_at > \"$since\")] | length")
          echo "近 20 小时已成功投递：$n 次"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          # 正文抽取遇到 403 的站点（France 24 等）要用无头浏览器兜底，
          # 所以 Actions 里也装一份 Chromium。
          python -m playwright install --with-deps chromium

      - name: Build the brief
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          PAYLOAD_LIMIT: ${{ github.event.client_payload.limit }}
        run: |
          ARGS=""
          # 手动触发的输入
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          # 外部触发时 client_payload 里带的参数
          if [ -n "${PAYLOAD_LIMIT:-}" ]; then ARGS="$ARGS --limit $PAYLOAD_LIMIT"; fi
          case "${PAYLOAD_DRY_RUN:-}" in
            true|True) ARGS="$ARGS --dry-run" ;;
          esac
          echo "运行参数：${ARGS:-（无）}"
          python -m newsbrief $ARGS

      - name: Upload artifacts
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
