name: daily-brief

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。23:03 UTC = 次日 07:03 北京时间。
    # 刻意避开整点：官方文档说明"高负载时段包括每个小时的开始"，
    # 整点排队的定时任务有概率被直接丢弃（不是延迟，是不留任何运行记录）。
    # 所以这里排两个时间点，第二个只在第一个没成功时才真的干活。
    - cron: "3 23 * * *"
    - cron: "33 23 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "只取前几条（留空 = 用 config.yaml 的 max_items）"
        type: string
        default: ""
      dry_run:
        description: "只生成文件，不发邮件也不推送"
        type: boolean
        default: false
      debug:
        description: "打印详细日志"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 同一天有两个定时点，第二次触发时如果第一次已经成功，就没必要再跑一遍
      # （否则会重复发邮件、重复推送）。手动触发不受这个判断影响。
      - name: Already delivered today?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?event=schedule&per_page=20" \
              --jq "[.workflow_runs[] | select(.conclusion == \"success\" and (.created_at | startswith(\"$today\")))] | length")
          echo "今天已成功的定时运行：$n 次"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          # 正文抽取遇到 403 的站点（France 24 等）要用无头浏览器兜底，
          # 所以 Actions 里也装一份 Chromium。
          python -m playwright install --with-deps chromium

      - name: Build the brief
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m newsbrief $ARGS

      - name: Upload artifacts
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
