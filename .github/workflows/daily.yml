name: daily-brief

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。23:00 UTC = 次日 07:00 北京时间。
    # 注意：定时触发可能有 5-30 分钟延迟，想更准就用一台常开的机器跑。
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "只取前几条（留空 = 用 config.yaml 的 max_items）"
        type: string
        default: ""
      dry_run:
        description: "只生成文件，不发邮件也不推送"
        type: boolean
        default: false
      debug:
        description: "打印详细日志"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 正文抽取遇到 403 的站点（France 24 等）要用无头浏览器兜底，
          # 所以 Actions 里也装一份 Chromium。
          python -m playwright install --with-deps chromium

      - name: Build the brief
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m newsbrief $ARGS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
