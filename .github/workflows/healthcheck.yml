name: healthcheck

# 哨兵：确认"今天该发的那份简报"真的生成了，没有就用 Bark 告警。
#
# 判定口径（踩过的坑都在这）：
# 1. 不能只看"有没有成功的运行"——被 guard 跳过的重复触发也是 success；
#    所以必须确认某次运行里的 "Build the brief" 步骤真的跑成功了。
# 2. 不能只看"最近一次成功运行"——重复触发（guard 跳过）常常排在真正的
#    投递之后，取最后一条就会一直误报"没生成"。
# 3. 时间窗口必须按北京自然日算，而不是"最近 N 小时"：
#    这个 workflow 自己的 cron 会被 GitHub 拖到下午甚至晚上才跑，
#    用小时窗口会横跨两天，把昨天的成功当成今天的。

on:
  schedule:
    - cron: "13 1 * * *"
  # 想随时手动验一次：POST /repos/<owner>/<repo>/dispatches，event_type=healthcheck
  # 带 {"client_payload":{"dry_run":true}} 就只打印判断结果、不发告警
  repository_dispatch:
    types: [healthcheck]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Did today's brief run?
        env:
          GH_TOKEN: ${{ github.token }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DRY: ${{ github.event.client_payload.dry_run }}
        run: |
          set -euo pipefail

          # 预期"今天"：07:00 之后看今天，07:00 之前（cron 被拖到凌晨）看昨天
          now_h=$((10#$(TZ=Asia/Shanghai date +%H)))
          local_day=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ "$now_h" -lt 7 ]; then
            local_day=$(TZ=Asia/Shanghai date -d "yesterday" +%Y-%m-%d)
          fi

          start=$(TZ=Asia/Shanghai date -d "$local_day 00:00" +%s)
          end=$(TZ=Asia/Shanghai date -d "$local_day 00:00 +1 day" +%s)
          since=$(date -u -d "@$start" +%Y-%m-%dT%H:%M:%SZ)
          until=$(date -u -d "@$end" +%Y-%m-%dT%H:%M:%SZ)
          echo "要检查的北京日期：$local_day（窗口 $since ~ $until）"

          # 该自然日内所有"运行成功"的简报（含被 guard 跳过的），最多看前 8 条
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=50" \
            --jq "[.workflow_runs[] | select(.created_at >= \"$since\" and .created_at < \"$until\" and .conclusion == \"success\")] | sort_by(.created_at) | reverse | .[0:8][] | .id")

          if [ -z "$ids" ]; then
            echo "$local_day 没有任何成功的运行"
          fi

          built=0
          for id in $ids; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq "[.jobs[].steps[] | select(.name == \"Build the brief\" and .conclusion == \"success\")] | length")
            echo "run $id：Build the brief 成功 $n 次"
            if [ "$n" -gt 0 ]; then
              built=1
              break
            fi
          done

          if [ "$built" -gt 0 ]; then
            echo "$local_day 的简报已生成，一切正常。"
            exit 0
          fi

          echo "没有真的生成简报，发告警。"
          if [ "${DRY:-}" = "true" ]; then
            echo "（干跑模式：不发 Bark 告警）"
            exit 0
          fi
          key="${BARK_URL%/}"
          key="${key##*/}"
          curl -sS -X POST "${BARK_URL%/}/push" \
            -H 'Content-Type: application/json' \
            -d "{\"device_key\":\"${key}\",\"title\":\"今天的简报没生成\",\"body\":\"北京日期 ${local_day} 没有成功构建的简报，去 Actions 页面看看。\",\"group\":\"运维告警\",\"level\":\"timeSensitive\",\"url\":\"https://github.com/${GITHUB_REPOSITORY}/actions\"}"
