# ============================================================
# 每日世界要闻简报 · 配置文件
# 所有 ${XXX} 会在运行时从环境变量读取（GitHub Actions 里用 Secrets）
# ============================================================

timezone: Asia/Shanghai

# 数据来源：
#   rss             自己抓 RSS + 用 DeepSeek 打分排序、写中文摘要与解读（默认，需要 DEEPSEEK_API_KEY）
#   newsminimalist  直接搬运 News Minimalist 已经排好序的英文稿件（备用，不需要 API key）
source: rss

# News Minimalist 通道
nm:
  # 只要这个分数以上的（站点自己的分档就是 5.0 / 5.5 / 6.0 三档）
  min_score: 5.0
  # 每天最多推送几条（按分数从高到低截断）
  max_items: 15
  # significance | coverage | latest，站点自带的排序方式
  sort: significance
  # 是否进入每条新闻的文章页抓摘要（关掉就只推标题+链接）
  fetch_summaries: true
  # 最多扫多少个站点地图分片来定位文章页，扫满还没凑齐就放弃
  sitemap_shards: 16
  output_dir: output
  timeout: 45
  retries: 3
  backoff: 4
  headless: true
  # Windows 用系统 Edge；GitHub Actions 的 ubuntu 上会自动回退到 bundled chromium
  channel: msedge
  # 分档：分数 >= min 进哪一档，用什么颜色
  tiers:
    - {name: "最重大", min: 6.0, accent: "#c0392b", note: "今天最该知道的事"}
    - {name: "重要",   min: 5.5, accent: "#b7791f", note: "值得花两分钟"}
    - {name: "值得一看", min: 5.0, accent: "#2c5f8a", note: "信息量够"}

# 只看最近多少小时内发布的新闻
window_hours: 26

# 单个源最多贡献多少条候选，避免快讯类站点刷屏
per_source_cap: 15

# 跨源同题聚合的相似度阈值（0-1，越大越严格）
cluster_threshold: 0.45

# 送去 AI 评估的候选上限，也是每天 token 成本的主要控制项
max_candidates: 100

# 最终推送的条数上限
max_items: 15

# 国内新闻保底：即使分数排在后面，也至少留几条中文源的新闻
balance:
  # 前 15 条里保证至少几条中文媒体（不区分国内/国际）
  zh_min: 6
  # 在这 15 条之后，再补几条"国内要闻"（与中国大陆直接相关的政策/经济/社会新闻）
  # 置 0 关闭；补充条目同样带摘要、解读、名词解释
  zh_extra: 5
  # 前 15 条里已经有几条国内新闻时就不再补充（按你的要求：已有则不加）
  zh_extra_skip_if: 2
  # 补充条目的分数下限，国内新闻的全球分普遍偏低，所以门槛放低
  zh_extra_min: 2.0

fetch:
  timeout: 20
  workers: 10
  # 没有发布时间的条目默认丢弃（有些源的时间戳不可信）
  allow_undated: false
  max_entries: 60

# 重要性分档：AI 打 0-10 分，这里决定分到哪一档、用什么颜色
tiers:
  - {name: "重大",     min: 7.0, accent: "#c0392b", note: "改变格局"}
  - {name: "重要",     min: 5.0, accent: "#b7791f", note: "值得知道"}
  - {name: "值得一看", min: 3.5, accent: "#2c5f8a", note: "有信息量"}

scoring:
  batch_size: 60
  # 对初评得分最高的一批做二次复核，稳住头部排序
  recalibrate: true
  recalibrate_top: 25

# 打分后用一次模型调用把"同一件事被不同媒体分别报道"的条目合并
dedupe:
  enabled: true
  top_k: 30

summarising:
  summary_batch_size: 6

# 正文抽取：RSS 只给标题和导语，入选的十几条再去抓一次正文，摘要才有料可写
extraction:
  enabled: true
  timeout: 15
  workers: 8
  # 每条正文送进模型的最大字数（越大越贵，1800 字符左右约够 3-5 段）
  max_chars: 2600

ai:
  # DeepSeek 官方模型：deepseek-flash（便宜快）/ deepseek-v4-pro（贵但强）
  model: deepseek-flash
  api_base: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}
  # V4 系列默认开启思考模式，思维链按输出计费且很慢；打分/摘要不需要，关掉
  thinking: disabled
  temperature: 0.3
  max_tokens: 8000
  timeout: 180
  retries: 3
  json_mode: true

delivery:
  email:
    enabled: true
    smtp_host: smtp.qq.com
    smtp_port: 465
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    from: ${SMTP_USER}
    to: yexin693@outlook.com
    sender_name: 每日要闻
  bark:
    enabled: true
    # 从 Bark App 里复制的那串地址，形如 https://api.day.app/你的KEY
    url: https://api.day.app/fekrCSJkr5nP8HHjq3TSwe/
    group: 每日要闻
    # APNs 单条上限 4KB，超过就裁成"其余要闻"清单
    max_bytes: 3400
    # 一条通知（默认）：按重要性降序，前几条带摘要/解读，其余只列标题。
    # true = 拆成多条推送，每条都带完整内容。
    split: true
    # 拆分模式下每条之间的间隔（秒）。推送是倒着发的（先发最后一屏），
    # 最后发的才是含第 1 条的那条，这样锁屏从上往下滑正好是 1→15。
    interval: 8
    reverse: true
    # 用 Markdown 排版（标题层级 / 引用块 / 粗体）；若通知里显示成原始 ** 符号，
    # 说明 Bark 版本偏旧，把它设成 false 就退回纯文本
    markdown: true
    sound: bell
    # 点开推送时跳转的地址，可留空；填了 GitHub Pages 地址更好用
    link: ""

# ============================================================
# 数据源：删掉不想要的、加上你要的都可以
